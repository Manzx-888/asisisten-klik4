name: Build Asisten Klik APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # =========================================
      # CHECKOUT
      # =========================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================
      # JAVA 17
      # =========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =========================================
      # ANDROID SDK
      # =========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # =========================================
      # CARI ZIP
      # =========================================
      - name: Find APK source ZIP
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "MENCARI ZIP"
          echo "========================================"

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan!"
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # =========================================
      # EXTRACT ZIP
      # =========================================
      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "========================================"
          echo "ISI ZIP"
          echo "========================================"

          find extracted -maxdepth 5 -type f | sort

      # =========================================
      # CARI PROJECT ANDROID
      # =========================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do

            DIR=$(dirname "$SETTINGS")

            if [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then

              PROJECT_DIR="$DIR"
              break

            fi

          done < <(
            find extracted -type f \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" \
            \) | sort
          )

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Project Android tidak ditemukan!"
            exit 1
          fi

          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # =========================================
      # FIX GRADLE WRAPPER
      # =========================================
      - name: Fix Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "FIX GRADLE WRAPPER"
          echo "========================================"

          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties tidak ditemukan!"
            exit 1
          fi

          echo "Wrapper sebelum:"
          cat gradle/wrapper/gradle-wrapper.properties

          # Paksa wrapper ke Gradle 8.11.1
          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.11.1-bin.zip#' \
            gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Wrapper sesudah:"
          cat gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

      # =========================================
      # CHECK PROJECT
      # =========================================
      - name: Check Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "CHECK PROJECT"
          echo "========================================"

          echo "PATH:"
          pwd

          echo ""
          echo "FILES:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "GRADLE VERSION:"
          ./gradlew --version

      # =========================================
      # BUILD APK
      # =========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILD APK"
          echo "========================================"

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # =========================================
      # CARI APK
      # =========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "MENCARI APK"
          echo "========================================"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          mkdir -p output

          cp "$APK" output/AsistenKlik.apk

      # =========================================
      # UPLOAD APK
      # =========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AsistenKlik-APK
          path: output/AsistenKlik.apk
          if-no-files-found: error

      # =========================================
      # SUCCESS
      # =========================================
      - name: Build Success
        run: |
          echo ""
          echo "========================================"
          echo "BUILD BERHASIL"
          echo "========================================"
          echo ""

          ls -lh output/AsistenKlik.apk
