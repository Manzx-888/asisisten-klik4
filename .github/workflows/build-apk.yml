name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.zip.outputs.zip }}" -d extracted

          echo "=== HASIL EXTRACT ==="
          find extracted -maxdepth 4 -type f | sort

      - name: Detect Android Project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT=""

          # Cari settings.gradle
          SETTINGS=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1 || true)

          if [ -n "$SETTINGS" ]; then
            PROJECT=$(dirname "$SETTINGS")
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Project ditemukan:"
          echo "$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      - name: Show Project
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project }}"

          echo "=== PROJECT ==="
          pwd

          echo
          echo "=== FILES ==="
          find . -maxdepth 4 -type f | sort

          echo
          echo "=== BUILD.GRADLE ==="
          cat build.gradle 2>/dev/null || true

          echo
          echo "=== SETTINGS.GRADLE ==="
          cat settings.gradle 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.7"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O /tmp/gradle.zip

          unzip -q /tmp/gradle.zip -d /opt

          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project }}"

          echo "=== BUILD APK ==="

          gradle assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find "${{ steps.project.outputs.project }}" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Asisten-Klik-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
