name: Build Asisten Klik APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # FIND ZIP
      # ==========================================
      - name: Find APK ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MENCARI ZIP APK"
          echo "======================================"

          ZIP=$(find . -maxdepth 1 -type f \
            \( -iname "*.zip" \) \
            -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP APK tidak ditemukan!"
            echo ""
            echo "File yang tersedia:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # ==========================================
      # EXTRACT ZIP
      # ==========================================
      - name: Extract APK project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d extracted

          echo "======================================"
          echo "ISI ZIP"
          echo "======================================"

          find extracted -maxdepth 4 -type f | sort

      # ==========================================
      # FIND ANDROID PROJECT
      # ==========================================
      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MENCARI PROJECT ANDROID"
          echo "======================================"

          PROJECT=""

          # Cari settings.gradle / settings.gradle.kts
          while IFS= read -r SETTINGS; do
            DIR=$(dirname "$SETTINGS")

            if [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then
              PROJECT="$DIR"
              break
            fi
          done < <(
            find extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/.gradle/*" \
              | sort
          )

          # Fallback: cari build.gradle + app
          if [ -z "$PROJECT" ]; then
            while IFS= read -r BUILD; do
              DIR=$(dirname "$BUILD")

              if [ -d "$DIR/app" ] && \
                 [ -f "$DIR/settings.gradle" -o -f "$DIR/settings.gradle.kts" ]; then
                PROJECT="$DIR"
                break
              fi
            done < <(
              find extracted \
                -type f \
                \( -name "build.gradle" -o -name "build.gradle.kts" \) \
                -not -path "*/.gradle/*" \
                | sort
            )
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Project Android tidak ditemukan!"
            echo ""
            echo "Struktur extracted:"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT=$PROJECT"

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"

      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # ANDROID SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # ANDROID SDK PACKAGES
      # ==========================================
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "INSTALL ANDROID SDK"
          echo "======================================"

          sdkmanager --licenses > /dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ==========================================
      # GRADLE 8.11.1
      # ==========================================
      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      # ==========================================
      # CHECK PROJECT
      # ==========================================
      - name: Check Android project
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "CHECK PROJECT"
          echo "======================================"

          echo "Working directory:"
          pwd

          echo ""
          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Settings:"
          if [ -f settings.gradle ]; then
            cat settings.gradle
          elif [ -f settings.gradle.kts ]; then
            cat settings.gradle.kts
          fi

      # ==========================================
      # BUILD DEBUG APK
      # ==========================================
      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "BUILD DEBUG APK"
          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      # ==========================================
      # FIND APK
      # ==========================================
      - name: Find APK
        id: apk
        working-directory: ${{ steps.project.outputs.project }}
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "MENCARI APK"
          echo "======================================"

          APK=$(find . \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"

            echo ""
            echo "Semua file APK:"
            find . -type f -name "*.apk" || true

            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ==========================================
      # COPY APK
      # ==========================================
      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p output

          cp "${{ steps.project.outputs.project }}/${{ steps.apk.outputs.apk }}" \
             "output/Asisten-Klik-debug.apk"

          echo "======================================"
          echo "APK SIAP"
          echo "======================================"

          ls -lh output/

      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Asisten-Klik-APK
          path: output/Asisten-Klik-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # BUILD SUCCESS
      # ==========================================
      - name: Build Success
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "       BUILD BERHASIL"
          echo "======================================"
          echo ""
          echo "APK:"
          ls -lh output/Asisten-Klik-debug.apk
          echo ""
          echo "Download APK melalui Artifacts."
