name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP APK tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -o "${{ steps.find_zip.outputs.zip }}" -d extracted

          echo "=== HASIL EXTRACT ==="
          find extracted -maxdepth 3 -type f | sort

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          PROJECT=$(find "$GITHUB_WORKSPACE/extracted" \
            -name settings.gradle \
            -o -name settings.gradle.kts \
            | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            echo "Isi extracted:"
            find "$GITHUB_WORKSPACE/extracted" -maxdepth 5 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Android project ditemukan:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show Project
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"

          echo "=== PROJECT ==="
          ls -la "$PROJECT"

          echo
          echo "=== FILES ==="
          find "$PROJECT" -maxdepth 3 -type f | sort

      - name: Check Gradle Version
        shell: bash
        run: |
          gradle --version

      - name: Fix Gradle Wrapper
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT"

          echo "=== BEFORE ==="

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            cat gradle/wrapper/gradle-wrapper.properties
          else
            echo "Wrapper belum ada."
          fi

          echo
          echo "=== GENERATE GRADLE WRAPPER 8.9 ==="

          gradle wrapper --gradle-version 8.9 --distribution-type bin

          chmod +x gradlew

          echo
          echo "=== AFTER ==="
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build Debug APK
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT"

          chmod +x gradlew

          ./gradlew clean assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          PROJECT="${{ steps.project.outputs.project_dir }}"

          APK=$(find "$PROJECT" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."

            echo
            echo "=== SEMUA APK ==="
            find "$PROJECT" -type f -name "*.apk" || true

            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AsistenKlik-debug
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
