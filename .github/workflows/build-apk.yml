name: Build Asisten Klik APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Check project
        run: |
          echo "================================"
          echo "CHECK PROJECT"
          echo "================================"

          pwd

          echo ""
          echo "FILES:"
          find . -maxdepth 5 -type f | sort

          echo ""
          echo "CHECK REQUIRED FILES:"

          test -f settings.gradle
          echo "OK settings.gradle"

          test -f build.gradle
          echo "OK build.gradle"

          test -f gradle.properties
          echo "OK gradle.properties"

          test -f app/build.gradle
          echo "OK app/build.gradle"

          test -f app/src/main/AndroidManifest.xml
          echo "OK AndroidManifest.xml"

          test -f app/src/main/res/xml/accessibility_service_config.xml
          echo "OK accessibility_service_config.xml"

          echo ""
          echo "PROJECT CHECK PASSED"

      - name: Clean previous build
        run: |
          gradle clean --no-daemon

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Check APK
        run: |
          echo "================================"
          echo "APK RESULT"
          echo "================================"

          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"
            exit 1
          fi

          echo ""
          echo "APK BERHASIL:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AsistenKlik-FullFix-CustomIcon
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
