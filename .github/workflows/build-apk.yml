name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: find_zip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.find_zip.outputs.zip }}" -d extracted

          echo "Isi hasil extract:"
          find extracted -maxdepth 4 -type f | sort | head -200

      - name: Find Android Project
        id: project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          # Cari gradlew terlebih dahulu
          GRADLEW=$(find extracted -type f -name "gradlew" | head -n 1 || true)

          if [ -n "$GRADLEW" ]; then
            PROJECT_DIR="$(dirname "$GRADLEW")"
          fi

          # Kalau tidak ada gradlew, cari settings.gradle / settings.gradle.kts
          if [ -z "$PROJECT_DIR" ]; then
            SETTINGS=$(find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1 || true)

            if [ -n "$SETTINGS" ]; then
              PROJECT_DIR="$(dirname "$SETTINGS")"
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Folder Android project tidak ditemukan."
            echo
            echo "Struktur ZIP:"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Android project ditemukan:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Show Project
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          echo "=== PROJECT ==="
          pwd

          echo
          echo "=== FILES ==="
          find . -maxdepth 3 -type f | sort

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          if [ ! -f "gradlew" ]; then
            echo "ERROR: gradlew tidak ditemukan di:"
            pwd
            ls -la
            exit 1
          fi

          chmod +x gradlew

          echo "Gradle wrapper ditemukan:"
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "${{ steps.project.outputs.project_dir }}"

          ./gradlew assembleDebug --stacktrace

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find "${{ steps.project.outputs.project_dir }}" \
            -type f \
            -name "*.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Asisten-Klik-APK
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
