name: Build Asisten Klik APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ========================================
      # JAVA 17
      # ========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ========================================
      # ANDROID SDK
      # ========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # ========================================
      # FIND ZIP
      # ========================================
      - name: Find APK source ZIP
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING ZIP"
          echo "========================================"

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP APK tidak ditemukan!"
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ========================================
      # EXTRACT ZIP
      # ========================================
      - name: Extract APK source
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          echo "Extracting:"
          echo "$ZIP_FILE"

          unzip -q "$ZIP_FILE" -d extracted

          echo ""
          echo "HASIL EXTRACT:"
          find extracted -maxdepth 4 -type f | sort | head -300

      # ========================================
      # LOCATE ANDROID PROJECT
      # ========================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "LOCATING ANDROID PROJECT"
          echo "========================================"

          PROJECT_DIR=""

          # Cari settings.gradle / settings.gradle.kts
          while IFS= read -r SETTINGS; do
            DIR=$(dirname "$SETTINGS")

            if [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | sort)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project tidak ditemukan!"
            echo ""
            echo "Isi ZIP:"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          # Hilangkan ./ kalau ada
          PROJECT_DIR="${PROJECT_DIR#./}"

          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ========================================
      # SHOW PROJECT
      # ========================================
      - name: Check Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "ANDROID PROJECT"
          echo "========================================"

          pwd

          echo ""
          echo "FILES:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "========================================"
          echo "GRADLE FILES"
          echo "========================================"

          ls -la

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle tidak ditemukan"
            exit 1
          fi

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: root build.gradle tidak ditemukan"
            exit 1
          fi

      # ========================================
      # INSTALL GRADLE 8.9
      # ========================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ========================================
      # BUILD APK
      # ========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "========================================"
          echo "BUILD APK"
          echo "========================================"

          gradle --version

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      # ========================================
      # FIND APK
      # ========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SEARCH APK"
          echo "========================================"

          APK=$(find "$PROJECT_DIR" -type f \
            -path "*/build/outputs/apk/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan!"
            echo ""
            find "$PROJECT_DIR" -type f -name "*.apk"
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/output/AsistenKlik.apk"

      # ========================================
      # UPLOAD APK
      # ========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AsistenKlik-APK
          path: output/AsistenKlik.apk
          if-no-files-found: error

      # ========================================
      # BUILD INFO
      # ========================================
      - name: Build success
        run: |
          echo ""
          echo "========================================"
          echo "BUILD BERHASIL"
          echo "========================================"
          echo ""
          echo "APK:"
          ls -lh output/AsistenKlik.apk
          
