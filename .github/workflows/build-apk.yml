name: Build Asisten Klik APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Check Android project
        run: |
          echo "=== PROJECT ==="
          pwd
          find . -maxdepth 4 -type f | sort
          echo "================"

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/xml/accessibility_service_config.xml

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Check APK
        run: |
          echo "=== APK ==="
          find app/build/outputs/apk -type f -name "*.apk" -print
          echo "==========="

          test -n "$(find app/build/outputs/apk -type f -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AsistenKlik-FullFix-CustomIcon
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
